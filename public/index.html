<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doffin Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --border: #e2e6ec;
    --border-light: #edf0f4;
    --text: #1a2332;
    --text-secondary: #5a6578;
    --text-muted: #8a94a6;
    --blue: #3b7ddd;
    --blue-light: #ebf2fc;
    --blue-hover: #2d6bc4;
    --green: #2d9f6f;
    --green-light: #e8f7f0;
    --green-hover: #248a5e;
    --red: #d64545;
    --red-light: #fceaea;
    --red-hover: #c03636;
    --orange: #e2853b;
    --gray: #8a94a6;
    --gray-light: #f0f2f5;
    --gray-hover: #767f8f;
    --claude: #c96442;
    --claude-light: #fbf1ec;
    --radius: 6px;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.1);
    --transition: 150ms ease;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .header-left h1 {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .header-left .subtitle {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .btn-refresh {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-refresh:hover {
    background: var(--gray-light);
    border-color: #cdd3dc;
  }
  .btn-refresh:active { transform: scale(0.97); }
  .btn-refresh.loading .refresh-icon { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Tabs ────────────────────────────────── */
  .tabs-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .tab-btn {
    position: relative;
    background: none;
    border: none;
    padding: 12px 20px;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: color var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .tab-btn::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 12px;
    right: 12px;
    height: 2px;
    background: transparent;
    border-radius: 2px 2px 0 0;
    transition: background var(--transition);
  }
  .tab-btn:hover { color: var(--text-secondary); }
  .tab-btn.active { color: var(--blue); }
  .tab-btn.active::after { background: var(--blue); }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: var(--gray-light);
    color: var(--text-muted);
    font-size: 0.72rem;
    font-weight: 600;
  }
  .tab-btn.active .badge {
    background: var(--blue-light);
    color: var(--blue);
  }

  .tabs-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    padding: 8px 0;
  }

  .btn-export {
    display: none;
    align-items: center;
    gap: 6px;
    background: var(--blue);
    border: none;
    border-radius: var(--radius);
    padding: 7px 14px;
    font-size: 0.78rem;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-export:hover { background: var(--blue-hover); }
  .btn-export:active { transform: scale(0.97); }
  .btn-export.visible { display: inline-flex; }

  /* ── Main content ───────────────────────── */
  .main {
    padding: 24px 32px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .table-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 860px;
  }

  thead th {
    text-align: left;
    padding: 10px 14px;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    white-space: nowrap;
    user-select: none;
  }
  thead th.sortable {
    cursor: pointer;
    position: relative;
  }
  thead th.sortable:hover {
    color: var(--text-primary);
  }
  thead th .sort-icon {
    display: inline-block;
    width: 14px;
    margin-left: 4px;
    vertical-align: middle;
    opacity: 0.3;
  }
  thead th.sort-active .sort-icon {
    opacity: 1;
  }
  thead th:first-child { border-radius: var(--radius-lg) 0 0 0; }
  thead th:last-child { border-radius: 0 var(--radius-lg) 0 0; }

  tbody tr {
    transition: background var(--transition);
  }
  tbody tr:hover { background: #f9fafb; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border-light); }

  td {
    padding: 10px 14px;
    font-size: 0.84rem;
    vertical-align: middle;
  }

  /* Column widths */
  .col-name { min-width: 240px; }
  .col-buyer { min-width: 160px; max-width: 220px; }
  .col-place { min-width: 80px; }
  .col-id { min-width: 80px; max-width: 160px; word-break: break-all; }
  .col-published { width: 96px; white-space: nowrap; }
  .col-deadline { width: 96px; white-space: nowrap; }
  .col-comment { min-width: 140px; }
  .col-actions { min-width: 120px; white-space: nowrap; text-align: right; }

  /* Name cell */
  .notice-name {
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  .notice-name-text {
    color: var(--text);
    font-weight: 500;
    cursor: pointer;
    transition: color var(--transition);
    line-height: 1.4;
  }
  .notice-name-text:hover { color: var(--blue); }

  .doffin-link {
    flex-shrink: 0;
    margin-top: 2px;
    color: var(--text-muted);
    transition: color var(--transition);
  }
  .doffin-link:hover { color: var(--blue); }
  .doffin-link svg { display: block; }

  .buyer-text {
    color: var(--text-secondary);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-width: 220px;
    word-break: break-word;
  }

  .place-text {
    color: var(--text-secondary);
  }

  .id-text {
    color: var(--text-secondary);
    font-size: 0.78rem;
  }

  .date-text { color: var(--text-secondary); }
  .date-text.deadline-soon {
    color: var(--red);
    font-weight: 600;
  }

  /* Sub-status select */
  .sub-status-select {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 0.75rem;
    font-family: var(--font);
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--surface);
    cursor: pointer;
    outline: none;
    transition: all var(--transition);
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238a94a6' stroke-width='2.5' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 6px center;
    padding-right: 20px;
  }
  .sub-status-select:focus { border-color: var(--blue); }
  .sub-status-select.ss-vurdering { color: var(--text-muted); }
  .sub-status-select.ss-under-arbeid { color: var(--blue); border-color: #c4d9f2; background-color: var(--blue-light); }
  .sub-status-select.ss-tilbud-sendt { color: var(--green); border-color: #c6e6d6; background-color: var(--green-light); }
  .sub-status-select.ss-blokkert { color: var(--red); border-color: #ecc; background-color: var(--red-light); }

  /* Comment field */
  .comment-input {
    width: 100%;
    min-width: 120px;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.82rem;
    font-family: var(--font);
    color: var(--text);
    background: transparent;
    transition: all var(--transition);
    resize: none;
    overflow: hidden;
    field-sizing: content;
    word-break: break-word;
  }
  .comment-input::placeholder { color: var(--text-muted); }
  .comment-input:hover { border-color: var(--border); background: var(--surface); }
  .comment-input:focus {
    outline: none;
    border-color: var(--blue);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(59,125,221,0.12);
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
  }

  .act-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: all var(--transition);
    color: var(--text-muted);
  }
  .act-btn svg { width: 14px; height: 14px; }

  .act-btn.act-relevant {
    color: var(--green);
    border-color: #c6e6d6;
    background: var(--green-light);
  }
  .act-btn.act-relevant:hover {
    background: #d1f0e0;
    border-color: #a5d6bd;
  }

  .act-btn.act-enrolled {
    color: var(--blue);
    border-color: #c4d9f2;
    background: var(--blue-light);
  }
  .act-btn.act-enrolled:hover {
    background: #dae8f9;
    border-color: #a8c8eb;
  }

  .act-btn.act-dismiss {
    color: var(--red);
    border-color: #ecc;
    background: var(--red-light);
  }
  .act-btn.act-dismiss:hover {
    background: #f8d8d8;
    border-color: #daa;
  }

  .act-btn.act-undo {
    color: var(--gray);
    border-color: var(--border);
    background: var(--gray-light);
  }
  .act-btn.act-undo:hover {
    background: #e4e7ec;
    border-color: #cdd3dc;
  }

  /* Expanded row */
  .expand-row td {
    padding: 0;
    border-bottom: 1px solid var(--border-light);
  }

  .expand-content {
    padding: 16px 14px 16px 14px;
    background: #fafbfc;
    border-top: 1px solid var(--border-light);
  }

  .expand-description {
    font-size: 0.84rem;
    color: var(--text-secondary);
    line-height: 1.65;
    max-width: 700px;
    white-space: pre-line;
    margin-bottom: 12px;
  }

  .expand-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    font-size: 0.8rem;
  }

  .expand-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--blue);
    text-decoration: none;
    font-weight: 500;
    transition: color var(--transition);
  }
  .expand-link:hover { color: var(--blue-hover); text-decoration: underline; }

  .expand-value {
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* Empty state */
  .empty-state {
    padding: 60px 20px;
    text-align: center;
  }
  .empty-state-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    color: var(--text-muted);
    opacity: 0.4;
  }
  .empty-state-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .empty-state-text {
    font-size: 0.84rem;
    color: var(--text-muted);
  }

  /* Loading state */
  .loading-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.84rem;
  }
  .loading-dots::after {
    content: "";
    animation: dots 1.4s steps(4,end) infinite;
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }

  /* Error state */
  .error-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--red);
    font-size: 0.84rem;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: #fff;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 0.82rem;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transform: translateY(8px);
    transition: all 250ms ease;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Tooltip on action buttons */
  .act-btn { position: relative; }
  .act-btn::before {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: #fff;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition);
  }
  .act-btn:hover::before { opacity: 1; }

  /* Row fade-out animation */
  .row-exit {
    animation: rowFade 300ms ease forwards;
  }
  @keyframes rowFade {
    to { opacity: 0; transform: translateX(16px); }
  }

  /* ── CPV Settings Panel ─────────────────── */
  .header-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-settings {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-settings:hover {
    background: var(--gray-light);
    border-color: #cdd3dc;
  }
  .btn-settings:active { transform: scale(0.97); }

  .cpv-panel {
    display: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
  }
  .cpv-panel.visible { display: block; }

  .cpv-panel-inner {
    max-width: 600px;
  }
  .cpv-panel-title {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
  }
  .cpv-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .cpv-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--blue-light);
    color: var(--blue);
    border: 1px solid #c9ddf5;
    border-radius: 20px;
    padding: 4px 10px 4px 12px;
    font-size: 0.78rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .cpv-tag button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--blue);
    cursor: pointer;
    border-radius: 50%;
    font-size: 1rem;
    line-height: 1;
    padding: 0;
    transition: background var(--transition);
  }
  .cpv-tag button:hover {
    background: rgba(59,125,221,0.15);
  }
  .cpv-add-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .cpv-input {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    font-size: 0.82rem;
    font-family: var(--font);
    width: 140px;
    outline: none;
    transition: border-color var(--transition);
  }
  .cpv-input:focus { border-color: var(--blue); }
  .cpv-input::placeholder { color: var(--text-muted); }
  .btn-cpv-add {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--blue);
    border: none;
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 0.78rem;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-cpv-add:hover { background: var(--blue-hover); }
  .btn-cpv-add:active { transform: scale(0.97); }
  .cpv-hint {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* ── Buyer Filter ──────────────────────────── */
  .filter-wrapper {
    position: relative;
    display: inline-flex;
  }
  .btn-filter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-filter:hover {
    background: var(--gray-light);
    color: var(--text-secondary);
  }
  .btn-filter.active-filter {
    color: var(--blue);
    background: var(--blue-light);
    border-color: #c9ddf5;
  }
  .filter-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: var(--blue);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 600;
  }
  .filter-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    z-index: 100;
    min-width: 280px;
    max-width: 380px;
    max-height: 400px;
    overflow: hidden;
    flex-direction: column;
  }
  .filter-dropdown.visible {
    display: flex;
  }
  .filter-search {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-light);
  }
  .filter-search input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    font-size: 0.82rem;
    font-family: var(--font);
    outline: none;
    transition: border-color var(--transition);
  }
  .filter-search input:focus { border-color: var(--blue); }
  .filter-search input::placeholder { color: var(--text-muted); }
  .filter-actions {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-light);
  }
  .filter-actions button {
    background: none;
    border: none;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--blue);
    cursor: pointer;
    padding: 2px 0;
  }
  .filter-actions button:hover { text-decoration: underline; }
  .filter-list {
    overflow-y: auto;
    max-height: 300px;
    padding: 4px 0;
  }
  .filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background var(--transition);
    font-size: 0.82rem;
    color: var(--text);
  }
  .filter-item:hover { background: var(--gray-light); }
  .filter-item input[type="checkbox"] {
    accent-color: var(--blue);
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .filter-item label {
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filter-item .filter-item-count {
    margin-left: auto;
    font-size: 0.72rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* ── Page Navigation ─────────────────────── */
  .page-nav {
    background: var(--text);
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .page-btn {
    position: relative;
    background: none;
    border: none;
    padding: 11px 22px;
    font-size: 0.85rem;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    cursor: pointer;
    transition: color var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

    return dd + '.' + mm + '.' + yyyy;
  }

  function isDeadlineSoon(dateStr) {
    if (!dateStr) return false;
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return false;
    const now = new Date();
    const diff = d.getTime() - now.getTime();
    return diff > 0 && diff < 30 * 24 * 60 * 60 * 1000;
  }

  function formatNOK(amount) {
    if (amount == null) return null;
    return Number(amount).toLocaleString('nb-NO', { maximumFractionDigits: 0 }) + ' NOK';
  }

  function escapeHtml(str) {
    if (!str) return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(str).replace(/[&<>"']/g, c => map[c]);
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('visible');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('visible'), 2200);
  }

  // ── Filter notices for tab ──────────────────
  function getNoticesForTab(tab) {
    let filtered;
    if (tab === 'nye') {
      filtered = notices.filter(n => !n.userStatus);
    } else if (tab === 'aktuelle') {
      filtered = notices.filter(n => n.userStatus === 'relevant');
    } else if (tab === 'paameldt') {
      filtered = notices.filter(n => n.userStatus === 'enrolled');
    } else {
      filtered = notices.filter(n => n.userStatus === 'dismissed');
    }
    // Filter by selected buyers
    if (selectedBuyers !== null) {
      filtered = filtered.filter(n => {
        const names = (n.buyer || []).map(b => b.name);
        return names.some(name => selectedBuyers.has(name));
      });
    }
    // Sort by active column
    filtered.sort((a, b) => {
      let va, vb;
      switch (sortColumn) {
        case 'name':
          va = (a.heading || '').toLowerCase();
          vb = (b.heading || '').toLowerCase();
          break;
        case 'buyer':
          va = ((a.buyer || []).map(x => x.name).join(', ') || '').toLowerCase();
          vb = ((b.buyer || []).map(x => x.name).join(', ') || '').toLowerCase();
          break;
        case 'place':
          va = ((a.placeOfPerformance && a.placeOfPerformance.length) ? a.placeOfPerformance.join(', ') : (a.locationId || []).join(', ')).toLowerCase();
          vb = ((b.placeOfPerformance && b.placeOfPerformance.length) ? b.placeOfPerformance.join(', ') : (b.locationId || []).join(', ')).toLowerCase();
          break;
        case 'internalId':
          va = (a.internalId || '').toLowerCase();
          vb = (b.internalId || '').toLowerCase();
          break;
        case 'published':
          va = new Date(a.publicationDate || 0).getTime();
          vb = new Date(b.publicationDate || 0).getTime();
          break;
        case 'deadline':
          va = new Date(a.deadline || 0).getTime();
          vb = new Date(b.deadline || 0).getTime();
          break;
        case 'comment':
          va = (a.userComment || '').toLowerCase();
          vb = (b.userComment || '').toLowerCase();
          break;
        default:
          va = new Date(a.publicationDate || 0).getTime();
          vb = new Date(b.publicationDate || 0).getTime();
      }
      if (va < vb) return sortDirection === 'asc' ? -1 : 1;
      if (va > vb) return sortDirection === 'asc' ? 1 : -1;
      return 0;
    });
    return filtered;
  }

  // ── Tab switching ───────────────────────────
  window.switchTab = function(tab) {
    activeTab = tab;
    expandedId = null;

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });

    const exportBtn = document.getElementById('btnExport');
    exportBtn.classList.toggle('visible', tab === 'aktuelle');

    render();
  };

  // ── Expand/collapse ─────────────────────────
  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    render();
  }

  // ── Supabase data layer ─────────────────────
  function getNoticesRef() {
    if (currentPage === 'dps') return dpsNotices;
    if (currentPage === 'rammeavtaler') return rammeavtalerNotices;
    return systemerNotices;
  }

  function setNoticesRef(arr) {
    if (currentPage === 'dps') dpsNotices = arr;
    else if (currentPage === 'rammeavtaler') rammeavtalerNotices = arr;
    else systemerNotices = arr;
    notices = arr;
  }

  async function fetchUserMap() {
    const { data: userData } = await sb
      .from('user_notices')
      .select('*');
    const userMap = {};
    if (userData) {
      for (const row of userData) {
        userMap[row.notice_id] = row;
      }
    }
    return userMap;
  }

  function mergeUserData(hits, userMap) {
    return hits.map(hit => {
      const ud = userMap[hit.id] || null;
      return {
        ...hit,
        userStatus: ud ? ud.status : null,
        userComment: ud ? ud.comment : '',
        userSubStatus: ud ? (ud.sub_status || 'vurdering') : 'vurdering',
        claudeState: ud ? (ud.claude_state || null) : null,
        claudeNote: ud ? (ud.claude_note || null) : null,
        claudeUpdatedAt: ud ? (ud.claude_updated_at || null) : null
      };
    });
  }

  async function fetchAiAnalyses() {
    const { data } = await sb
      .from('ai_analyses')
      .select('notice_id, analysis');
    if (data) {
      for (const row of data) {
        aiAnalyses[row.notice_id] = row;
      }
    }
  }

  async function fetchAllData() {
    // Fetch DPS, open competitions, user data and AI analyses in parallel
    const [dpsResp, openResp, userMap] = await Promise.all([
      fetch(SUPABASE_URL + '/functions/v1/doffin-proxy', {
        headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
      }),
      fetch(SUPABASE_URL + '/functions/v1/doffin-proxy-open', {
        headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
      }),
      fetchUserMap(),
      fetchAiAnalyses()
    ]);

    if (!dpsResp.ok) throw new Error('DPS HTTP ' + dpsResp.status);
    if (!openResp.ok) throw new Error('Open HTTP ' + openResp.status);

    const dpsData = await dpsResp.json();
    const openData = await openResp.json();

    // Split open notices by category
    const rammeavtalerHits = (openData.hits || []).filter(h => h.category === 'rammeavtale');
    const systemerHits = (openData.hits || []).filter(h => h.category === 'system');

    // Merge with user data
    dpsNotices = mergeUserData(dpsData.hits || [], userMap);
    rammeavtalerNotices = mergeUserData(rammeavtalerHits, userMap);
    systemerNotices = mergeUserData(systemerHits, userMap);

    // Auto-set "feiltagget" comment on mistagged DPS notices
    for (const n of dpsNotices) {
      if (n.mistagged && !n.userComment && !n.userStatus) {
        n.userComment = 'feiltagget';
        sb.from('user_notices').upsert({
          notice_id: n.id,
          status: null,
          comment: 'feiltagget',
          updated_at: new Date().toISOString()
        }, { onConflict: 'notice_id' }).then(() => {});
      }
    }

    // Point notices to current page
    notices = getNoticesRef();
  }

  // Legacy function for compatibility
  async function fetchNotices() {
    await fetchAllData();
    return notices;
  }

  async function upsertUserData(id, status, comment, subStatus) {
    lastLocalEditAt = Date.now();
    const row = {
      notice_id: id,
      status: status,
      comment: comment || '',
      updated_at: new Date().toISOString()
    };
    if (subStatus !== undefined) row.sub_status = subStatus;
    const { error } = await sb
      .from('user_notices')
      .upsert(row, { onConflict: 'notice_id' });
    if (error) throw error;
  }

  async function deleteUserData(id) {
    lastLocalEditAt = Date.now();
    const { error } = await sb
      .from('user_notices')
      .delete()
      .eq('notice_id', id);
    if (error) throw error;
  }

  // ── Set status (optimistic) ─────────────────
  async function setStatus(id, status) {
    const notice = notices.find(n => n.id === id);
    if (!notice) return;

    const previousStatus = notice.userStatus;

    // Animate out
    const row = document.getElementById('row-' + CSS.escape(id));
    if (row) {
      row.classList.add('row-exit');
      const expandRow = row.nextElementSibling;
      if (expandRow && expandRow.classList.contains('expand-row')) {
        expandRow.classList.add('row-exit');
      }
    }

    // Optimistic update after animation
    setTimeout(async () => {
      notice.userStatus = status;
      if (status === 'relevant') notice.userSubStatus = 'vurdering';
      if (expandedId === id) expandedId = null;
      render();

      const labels = { dismissed: 'Avvist', relevant: 'Markert som aktuell', enrolled: 'Markert som påmeldt' };
      showToast(labels[status] || 'Oppdatert');

      try {
        const subSt = status === 'relevant' ? 'vurdering' : undefined;
        await upsertUserData(id, status, notice.userComment || '', subSt);
      } catch (err) {
        console.error('Feil ved lagring:', err);
        notice.userStatus = previousStatus;
        render();
        showToast('Feil ved lagring');
      }
    }, 280);
  }

  // ── Reset status ────────────────────────────
  async function resetStatus(id) {
    const notice = notices.find(n => n.id === id);
    if (!notice) return;

    const previousStatus = notice.userStatus;

    const row = document.getElementById('row-' + CSS.escape(id));
    if (row) {
      row.classList.add('row-exit');
      const expandRow = row.nextElementSibling;
      if (expandRow && expandRow.classList.contains('expand-row')) {
        expandRow.classList.add('row-exit');
      }
    }

    setTimeout(async () => {
      notice.userStatus = null;
      // Raden slettes, så Claude-tilstanden forsvinner også.
      notice.claudeState = null;
      notice.claudeNote = null;
      notice.claudeUpdatedAt = null;
      if (expandedId === id) expandedId = null;
      render();
      showToast('Tilbakestilt');

      try {
        await deleteUserData(id);
      } catch (err) {
        console.error('Feil ved tilbakestilling:', err);
        notice.userStatus = previousStatus;
        render();
        showToast('Feil ved tilbakestilling');
      }
    }, 280);
  }

  // ── Comment handling (debounced) ────────────
  function onCommentInput(id, value) {
    lastLocalEditAt = Date.now();
    const notice = notices.find(n => n.id === id);
    if (notice) notice.userComment = value;

    clearTimeout(commentTimers[id]);
    commentTimers[id] = setTimeout(() => {
      saveComment(id, value);
    }, 500);
  }

  async function saveComment(id, value) {
    clearTimeout(commentTimers[id]);

    const notice = notices.find(n => n.id === id);
    if (!notice) return;

    try {
      if (notice.userStatus) {
        await upsertUserData(id, notice.userStatus, value || '');
      } else {
        // No status yet — need to save with a temporary marker
        // Only save if there's actually a comment
        if (value && value.trim()) {
          await upsertUserData(id, 'relevant', value);
          notice.userStatus = 'relevant';
          render();
          showToast('Kommentar lagret (markert som aktuell)');
        }
      }
    } catch (err) {
      console.error('Feil ved lagring av kommentar:', err);
      showToast('Feil ved lagring av kommentar');
    }
  }

  // ── Export ──────────────────────────────────
  window.exportRelevant = function() {
    const relevant = notices.filter(n => n.userStatus === 'relevant');
    const exported = relevant.map(n => ({
      name: n.heading || n.id,
      customer: (n.buyer && n.buyer.length > 0) ? n.buyer[0].name : 'Ukjent',
      link: 'https://doffin.no/notices/' + n.id
    }));

    const blob = new Blob([JSON.stringify(exported, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    a.href = url;
    a.download = 'doffin-aktuelle-' + yyyy + '-' + mm + '-' + dd + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Eksport lastet ned');
  };

  // ── Refresh data ────────────────────────────
  window.refreshData = async function() {
    const btn = document.getElementById('btnRefresh');
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      await fetchAllData();
      updateSubtitle();
      updatePageBadges();
      render();
      scheduleClaudePoll();
      showToast('Data oppdatert');
    } catch (err) {
      console.error('Feil ved oppdatering:', err);
      showToast('Feil ved henting av data');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  };

  // ── Initial load ────────────────────────────
  async function init() {
    // Detect page from hash
    const hash = window.location.hash.replace('#', '');
    if (['dps', 'rammeavtaler', 'systemer'].indexOf(hash) !== -1) {
      currentPage = hash;
    }

    // Set initial page nav state
    document.querySelectorAll('.page-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.page === currentPage);
    });
    document.getElementById('pageTitle').textContent = pageTitles[currentPage] || 'Doffin Monitor';

    try {
      await fetchAllData();
      updateSubtitle();
      updatePageBadges();
      render();
      scheduleClaudePoll();
    } catch (err) {
      console.error('Initialiseringsfeil:', err);
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML =
        '<tr><td colspan="8" class="error-state">' +
          'Kunne ikke hente data. Pr\u00F8v \u00E5 oppdatere siden.' +
        '</td></tr>';
      document.getElementById('subtitle').textContent = 'Feil ved lasting av data';
    }
  }

  // ── Hash change listener ───────────────────
  window.addEventListener('hashchange', function() {
    const hash = window.location.hash.replace('#', '');
    if (['dps', 'rammeavtaler', 'systemer'].indexOf(hash) !== -1 && hash !== currentPage) {
      switchPage(hash);
    }
  });

  // ── Sort by column ─────────────────────────
  function sortBy(column) {
    if (sortColumn === column) {
      sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    } else {
      sortColumn = column;
      sortDirection = (column === 'published' || column === 'deadline') ? 'desc' : 'asc';
    }
    updateSortHeaders();
    render();
  }

  function updateSortHeaders() {
    document.querySelectorAll('thead th.sortable').forEach(th => {
      const col = th.dataset.sort;
      const icon = th.querySelector('.sort-icon');
      if (col === sortColumn) {
        th.classList.add('sort-active');
        icon.innerHTML = sortDirection === 'asc' ? '&#x2191;' : '&#x2193;';
      } else {
        th.classList.remove('sort-active');
        icon.innerHTML = '&#x2195;';
      }
    });
  }

  // ── Søk med Claude ─────────────────────────
  // Brukeren kopierer en ferdig prompt til sin egen Claude (eget abonnement,
  // ikke Claude-API-et). Prompten inneholder ferdige statuslenker med en
  // engangsnøkkel; Claude åpner dem (web_fetch / WebFetch / curl) og
  // edge-funksjonen claude-task oppdaterer user_notices. Dashboardet poller
  // og viser fremdriften.

  // Selskapsinfo som legges inn i prompten. Rediger ved behov.
  const COMPANY = {
    name: 'Commit AS',
    orgnr: '934 427 688',
    address: 'Karl Johans gate 25, Oslo (avdeling i Vestfold/Tønsberg)',
    about: 'IT-konsulentselskap med ca. 28 konsulenter, eid likeverdig av de ansatte. Leverer konsulentbistand innen systemutvikling, arkitektur og prosjektledelse.'
  };

  const CLAUDE_TASK_URL = SUPABASE_URL + '/functions/v1/claude-task';
  const CLAUDE_POLL_MS = 20000;
  // Hvor lenge en tilstand regnes som aktiv uten nye oppdateringer fra Claude.
  const CLAUDE_STALE_MS = { queued: 2 * 3600e3, working: 12 * 3600e3, waiting: 7 * 24 * 3600e3 };
  const CLAUDE_LABELS = { queued: 'Lim inn i Claude', working: 'Claude jobber', waiting: 'Venter på deg', done: 'Claude ferdig' };

  let claudeModalNoticeId = null;
  let claudeModalPrompt = '';

  function claudeInfo(n) {
    const st = n.claudeState;
    if (!st) return null;
    const ts = n.claudeUpdatedAt ? new Date(n.claudeUpdatedAt).getTime() : NaN;
    const age = isNaN(ts) ? Infinity : Date.now() - ts;
    const tracked = Object.prototype.hasOwnProperty.call(CLAUDE_STALE_MS, st);
    const stale = tracked && age > CLAUDE_STALE_MS[st];
    return { state: st, stale: stale, active: tracked && !stale };
  }

  function formatRelative(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    const min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 1) return 'nå';
    if (min < 60) return min + ' min siden';
    const hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (min < 24 * 60 && d.getDate() === new Date().getDate()) return 'kl. ' + hh;
    return formatDate(dateStr) + ' ' + hh;
  }

  function formatDateTime(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return null;
    return formatDate(dateStr) + ' kl. ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // Knapp eller statuschip + siste notat, under tittelen i navnekolonnen.
  function claudeRowHtml(n) {
    if (currentPage !== 'dps') return '';
    const info = claudeInfo(n);
    const showChip = info && info.state !== 'done' && !(info.state === 'queued' && info.stale);
    const canStart = activeTab === 'nye' || activeTab === 'aktuelle';
    let control = '';

    if (showChip) {
      let cls, inner;
      if (info.stale) {
        cls = 'cs-stale';
        inner = '<span class="cl-dot"></span>Claude stille';
      } else if (info.state === 'working') {
        cls = 'cs-working';
        inner = '<span class="cl-spinner"></span>' + CLAUDE_LABELS.working;
      } else if (info.state === 'waiting') {
        cls = 'cs-waiting';
        inner = '<span class="cl-dot pulse"></span>' + CLAUDE_LABELS.waiting;
      } else {
        cls = 'cs-queued';
        inner = '<span class="cl-dot pulse"></span>' + CLAUDE_LABELS.queued;
      }
      control = '<button class="claude-chip ' + cls + '" title="Sist oppdatert ' + escapeHtml(formatRelative(n.claudeUpdatedAt)) + '" onclick="app.openClaudeTask(\'' + n.id + '\')">' + inner + '</button>';
    } else if (canStart) {
      control = '<button class="claude-btn" onclick="app.startClaude(\'' + n.id + '\')">' + icons.sparkle + 'Søk med Claude</button>';
    }

    let note = '';
    if (info && n.claudeNote) {
      note = '<span class="claude-note"><strong>Claude:</strong> ' + escapeHtml(n.claudeNote) +
        (n.claudeUpdatedAt ? ' · ' + escapeHtml(formatRelative(n.claudeUpdatedAt)) : '') + '</span>';
    }

    if (!control && !note) return '';
    return '<div class="claude-row">' + control + note + '</div>';
  }

  function newClaudeToken() {
    const bytes = new Uint8Array(24);
    crypto.getRandomValues(bytes);
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function copyText(text) {
    // Startes direkte i klikket så nettleseren godtar kopieringen.
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function findNoticeAnywhere(id) {
    return dpsNotices.find(n => n.id === id) ||
      rammeavtalerNotices.find(n => n.id === id) ||
      systemerNotices.find(n => n.id === id) || null;
  }

  async function startClaude(id) {
    const notice = findNoticeAnywhere(id);
    if (!notice) return;

    const token = newClaudeToken();
    const prompt = buildClaudePrompt(notice, token);
    const copied = copyText(prompt);

    // Registrer nøkkelen slik at statuslenkene virker.
    let registered = true;
    try {
      const resp = await fetch(CLAUDE_TASK_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ action: 'create', token: token, notice_id: id })
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
    } catch (err) {
      console.error('Kunne ikke registrere Claude-oppgave:', err);
      registered = false;
    }

    if (registered) {
      const info = claudeInfo(notice);
      if (!info || !info.active || info.state === 'queued') {
        notice.claudeState = 'queued';
        notice.claudeNote = 'Prompt kopiert – venter på at Claude starter';
        notice.claudeUpdatedAt = new Date().toISOString();
      }
      render();
      scheduleClaudePoll();
    }

    showClaudeStartModal(notice, prompt, await copied, registered);
  }

  function setModal(title, sub, bodyHtml, actionsHtml) {
    document.getElementById('claudeModalTitle').textContent = title;
    document.getElementById('claudeModalSub').textContent = sub;
    document.getElementById('claudeModalBody').innerHTML = bodyHtml;
    document.getElementById('claudeModalActions').innerHTML = actionsHtml;
    document.getElementById('claudeModal').classList.add('visible');

    }

      body += '<div class="modal-warning">Nettleseren stoppet automatisk kopiering. Kopier prompten fra feltet under.</div>';
    }

        '<li>Åpne Claude og start en ny samtale.</li>' +

      '<details' + (copied ? '' : ' open') + '><summary>Vis prompten</summary>' +

      '<button class="modal-btn" onclick="app.closeClaudeModal()">Lukk</button>' +

    );

    if (!copied) { ta.focus(); ta.select(); }

  function openClaudeTask(id) {
    const notice = findNoticeAnywhere(id);
    if (!notice) return;
    claudeModalNoticeId = id;
    const info = claudeInfo(notice);
    const label = info ? (info.stale ? 'Ingen oppdatering fra Claude på en stund' : (CLAUDE_LABELS[info.state] || info.state)) : 'Ingen Claude-oppgave';
    const when = notice.claudeUpdatedAt ? 'Sist oppdatert ' + formatRelative(notice.claudeUpdatedAt) : '';

    let body = '<ol style="list-style:none;padding-left:0">' +
      (notice.claudeNote ? '<li><strong>Siste notat:</strong> ' + escapeHtml(notice.claudeNote) + '</li>' : '') +
      (when ? '<li>' + escapeHtml(when) + '</li>' : '') +
      '</ol>';
    if (info && info.stale) {
      body += '<div class="modal-warning" style="color:var(--text-secondary);background:var(--gray-light)">Claude-samtalen kan ha stoppet. Fortsett i samme samtale, kopier en ny prompt, eller avbryt for å styre statusen manuelt.</div>';
    }

    setModal(
      label,
      notice.heading || notice.id,
      body,
      '<button class="modal-btn danger left" onclick="app.cancelClaude(\'' + id + '\')">Avbryt Claude-oppgave</button>' +
      '<button class="modal-btn" onclick="app.closeClaudeModal()">Lukk</button>' +
      '<button class="modal-btn primary" onclick="app.closeClaudeModal();app.startClaude(\'' + id + '\')">Kopier ny prompt</button>'
    );
  }

  function closeClaudeModal() {
    document.getElementById('claudeModal').classList.remove('visible');
    claudeModalNoticeId = null;
  }

  function copyClaudePrompt() {
    copyText(claudeModalPrompt).then(ok => showToast(ok ? 'Prompt kopiert' : 'Kunne ikke kopiere – merk teksten manuelt'));
  }

  async function cancelClaude(id) {
    const notice = findNoticeAnywhere(id);
    if (!notice) return;
    closeClaudeModal();
    const prev = { s: notice.claudeState, n: notice.claudeNote, u: notice.claudeUpdatedAt };
    notice.claudeState = null;
    notice.claudeNote = null;
    notice.claudeUpdatedAt = new Date().toISOString();
    render();
    lastLocalEditAt = Date.now();
    const { error } = await sb
      .from('user_notices')
      .update({ claude_state: null, claude_note: null, claude_updated_at: notice.claudeUpdatedAt })
      .eq('notice_id', id);
    if (error) {
      console.error('Feil ved avbryting:', error);
      notice.claudeState = prev.s; notice.claudeNote = prev.n; notice.claudeUpdatedAt = prev.u;
      render();
      showToast('Feil ved avbryting');
    } else {
      showToast('Claude-oppgave avbrutt');
    }
  }

  // ── Polling av status mens Claude jobber ────
  let claudePollTimer = null;

  function anyClaudeActive() {
    return [dpsNotices, rammeavtalerNotices, systemerNotices].some(arr =>
      arr.some(n => { const i = claudeInfo(n); return i && i.active; }));
  }

  function scheduleClaudePoll() {
    if (claudePollTimer || !anyClaudeActive()) return;
    claudePollTimer = setInterval(() => {
      if (!anyClaudeActive()) {
        clearInterval(claudePollTimer);
        claudePollTimer = null;
        return;
      }
      pollUserData();
    }, CLAUDE_POLL_MS);
  }

  function isEditingComment() {
    const el = document.activeElement;
    return !!(el && el.classList && el.classList.contains('comment-input'));
  }

  async function pollUserData() {
    if (document.visibilityState !== 'visible') return;
    const startedAt = Date.now();
    let userMap;
    try {
      userMap = await fetchUserMap();
    } catch (err) {
      return;
    }
    // En lokal endring under eller rett før hentingen vinner.
    if (lastLocalEditAt > startedAt - 3000) return;

    let changed = false;
    const claudeChanges = [];
    for (const arr of [dpsNotices, rammeavtalerNotices, systemerNotices]) {
      for (const n of arr) {
        const ud = userMap[n.id] || null;
        const next = {
          userStatus: ud ? ud.status : null,
          userSubStatus: ud ? (ud.sub_status || 'vurdering') : 'vurdering',
          claudeState: ud ? (ud.claude_state || null) : null,
          claudeNote: ud ? (ud.claude_note || null) : null,
          claudeUpdatedAt: ud ? (ud.claude_updated_at || null) : null
        };
        let claudeChanged = false;
        for (const k in next) {
          if (n[k] !== next[k]) {
            n[k] = next[k];
            changed = true;
            if (k === 'claudeState' || k === 'claudeNote') claudeChanged = true;
          }
        }
        if (claudeChanged && n.claudeState) claudeChanges.push(n);
      }
    }

    if (!changed) return;
    if (claudeChanges.length === 1) {
      const n = claudeChanges[0];
      showToast('Claude: ' + (n.claudeNote || CLAUDE_LABELS[n.claudeState] || 'oppdatert'));
    } else if (claudeChanges.length > 1) {
      showToast('Claude oppdaterte ' + claudeChanges.length + ' kunngjøringer');
    }
    if (isEditingComment()) {
      pendingRender = true;
    } else {
      render();
    }
    scheduleClaudePoll();
  }

  document.addEventListener('focusout', function(e) {
    if (pendingRender && e.target && e.target.classList && e.target.classList.contains('comment-input')) {
      pendingRender = false;
      setTimeout(render, 0);
    }
  });

  // Sjekk med en gang når brukeren kommer tilbake fra Claude-fanen.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && anyClaudeActive()) pollUserData();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('claudeModal').classList.contains('visible')) closeClaudeModal();
  });

  // ── Page switching ─────────────────────────
  window.switchPage = function(page) {
    currentPage = page;
    notices = getNoticesRef();
    activeTab = 'nye';
    expandedId = null;
    selectedBuyers = null;
    sortColumn = 'published';
    sortDirection = 'desc';

    // Update hash without triggering hashchange
    history.replaceState(null, '', '#' + page);

    // Update page nav buttons
    document.querySelectorAll('.page-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.page === page);
    });

    // Update header title
    document.getElementById('pageTitle').textContent = pageTitles[page] || 'Doffin Monitor';

    // Update tab buttons active state
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.tab === activeTab);
    });

    // Reset sort headers
    updateSortHeaders();

    // Update filter
    updateFilterButton();

    updateSubtitle();
    updatePageBadges();
    render();
  };

  window.app = {
    toggleExpand: toggleExpand,
    setStatus: setStatus,
    resetStatus: resetStatus,
    onCommentInput: onCommentInput,
    saveComment: saveComment,
    sortBy: sortBy,
    setSubStatus: setSubStatus,
    analyzeNotice: analyzeNotice
  };

  // ── CPV code management ───────────────────
  window.toggleCpvPanel = function() {
    const panel = document.getElementById('cpvPanel');
    panel.classList.toggle('visible');
    if (panel.classList.contains('visible')) {
      loadCpvCodes();
    }
  };

  async function loadCpvCodes() {
    const { data, error } = await sb
      .from('cpv_codes')
      .select('code')
      .order('code');
    if (error) {
      showToast('Kunne ikke hente CPV-koder');
      return;
    }
    renderCpvCodes((data || []).map(r => r.code));
  }

  function renderCpvCodes(codes) {
    const list = document.getElementById('cpvList');
    if (codes.length === 0) {
      list.innerHTML = '<span style="font-size:0.82rem;color:var(--text-muted)">Ingen CPV-koder konfigurert</span>';
      return;
    }
    list.innerHTML = codes.map(code =>
      '<span class="cpv-tag">' + escapeHtml(code) +
      '<button onclick="removeCpvCode(\'' + escapeHtml(code) + '\')" title="Fjern">&times;</button></span>'
    ).join('');
  }

  window.addCpvCode = async function() {
    const input = document.getElementById('cpvInput');
    const code = input.value.trim();
    if (!/^\d{8}$/.test(code)) {
      showToast('CPV-kode må være 8 siffer');
      return;
    }
    const { error } = await sb
      .from('cpv_codes')
      .upsert({ code: code }, { onConflict: 'code' });
    if (error) {
      showToast('Kunne ikke legge til CPV-kode');
      return;
    }
    input.value = '';
    showToast('CPV-kode ' + code + ' lagt til');
    loadCpvCodes();
  };

  window.removeCpvCode = async function(code) {
    const { error } = await sb
      .from('cpv_codes')
      .delete()
      .eq('code', code);
    if (error) {
      showToast('Kunne ikke fjerne CPV-kode');
      return;
    }
    showToast('CPV-kode ' + code + ' fjernet');
    loadCpvCodes();
  };

  // ── Buyer filter ───────────────────────────
  function getAllBuyers() {
    const counts = {};
    for (const n of notices) {
      for (const b of (n.buyer || [])) {
        counts[b.name] = (counts[b.name] || 0) + 1;
      }
    }
    return Object.entries(counts)
      .sort((a, b) => a[0].localeCompare(b[0], 'nb'))
      .map(([name, count]) => ({ name, count }));
  }

  function renderFilterList() {
    const allBuyers = getAllBuyers();
    const search = filterSearchText.toLowerCase();
    const filtered = search
      ? allBuyers.filter(b => b.name.toLowerCase().includes(search))
      : allBuyers;

    const list = document.getElementById('filterList');
    list.innerHTML = filtered.map(b => {
      const checked = selectedBuyers === null || selectedBuyers.has(b.name);
      return '<label class="filter-item">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') +
        ' onchange="app.toggleBuyer(\'' + escapeHtml(b.name.replace(/'/g, "\\'")) + '\', this.checked)">' +
        '<span>' + escapeHtml(b.name) + '</span>' +
        '<span class="filter-item-count">' + b.count + '</span>' +
        '</label>';
    }).join('');
  }

  function updateFilterButton() {
    const btn = document.getElementById('btnFilter');
    const allCount = getAllBuyers().length;
    if (selectedBuyers !== null && selectedBuyers.size < allCount) {
      btn.classList.add('active-filter');
      btn.innerHTML =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>' +
        'Kunde <span class="filter-count">' + selectedBuyers.size + '</span>';
    } else {
      btn.classList.remove('active-filter');
      btn.innerHTML =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>' +
        'Kunde';
    }
  }

  function toggleFilter() {
    const dd = document.getElementById('filterDropdown');
    const isVisible = dd.classList.contains('visible');
    if (isVisible) {
      dd.classList.remove('visible');
    } else {
      filterSearchText = '';
      document.getElementById('filterSearchInput').value = '';
      renderFilterList();
      dd.classList.add('visible');
    }
  }

  function toggleBuyer(name, checked) {
    const allBuyers = getAllBuyers();
    if (selectedBuyers === null) {
      selectedBuyers = new Set(allBuyers.map(b => b.name));
    }
    if (checked) {
      selectedBuyers.add(name);
      if (selectedBuyers.size === allBuyers.length) {
        selectedBuyers = null;
      }
    } else {
      selectedBuyers.delete(name);
    }
    updateFilterButton();
    render();
  }

  function filterSelectAll() {
    selectedBuyers = null;
    renderFilterList();
    updateFilterButton();
    render();
  }

  function filterSelectNone() {
    selectedBuyers = new Set();
    renderFilterList();
    updateFilterButton();
    render();
  }

  function onFilterSearch(text) {
    filterSearchText = text;
    renderFilterList();
  }

  // Close filter dropdown when clicking outside
  document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.filter-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
      document.getElementById('filterDropdown').classList.remove('visible');
    }
  });

  function filterByBuyer(name) {
    selectedBuyers = new Set([name]);
    updateFilterButton();
    render();
    showToast('Filtrert på ' + name);
  }

  window.app = Object.assign(window.app, {
    toggleFilter: toggleFilter,
    toggleBuyer: toggleBuyer,
    filterSelectAll: filterSelectAll,
    filterSelectNone: filterSelectNone,
    onFilterSearch: onFilterSearch,
    filterByBuyer: filterByBuyer,
    startClaude: startClaude,
    openClaudeTask: openClaudeTask,
    closeClaudeModal: closeClaudeModal,
    copyClaudePrompt: copyClaudePrompt,
    cancelClaude: cancelClaude
  });

  init();
})();
</script>
</body>
</html>
